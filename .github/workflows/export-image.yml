name: export-loopforge-image
on:
  workflow_dispatch:

# 允许 workflow 用内置 token 创建 Release
permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and export LoopForge image
        run: |
          docker pull ghcr.io/tencent/loopforge:0.4.2
          echo "LoopForge RepoDigest: $(docker image inspect --format '{{index .RepoDigests 0}}' ghcr.io/tencent/loopforge:0.4.2)"
          docker save ghcr.io/tencent/loopforge:0.4.2 | gzip > loopforge-0.4.2.tar.gz

      - name: Show sizes
        run: ls -lh *.tar.gz

      # 快速下载通道:发到 Release,公开仓库的资产可匿名直链,可套加速代理
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create img-${{ github.run_id }} \
            --title "LoopForge images run ${{ github.run_id }}" \
            --notes "loopforge 0.4.2 RepoDigest: sha256:a98a6c2c2c1c67ac98234dca07e3e1d287dace67f1108adc70266e955fecb564 (与 GitHub Release v0.4.2 官方记录一致)" \
            loopforge-0.4.2.tar.gz

      # 备用通道:artifact 保留,以防 Release 渠道有问题;不需要可整段删除
      - uses: actions/upload-artifact@v4
        with:
          name: loopforge-images
          path: |
            loopforge-0.4.2.tar.gz
          compression-level: 0
